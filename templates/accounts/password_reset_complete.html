{% extends 'base.html' %}

{% block title %}Password Updated | Multiply{% endblock %}

{% block content %}
<section class="mx-auto max-w-lg rounded-xl bg-white p-5 shadow-md sm:p-8">
    <p class="text-sm font-semibold uppercase tracking-wide text-emerald-700">Password updated</p>
    <h1 class="mt-2 text-2xl font-bold text-indigo-950">You’re ready to sign in</h1>
    <p class="mt-2 text-sm text-gray-600">Your password has been changed.</p>
    <a href="{% url 'login' %}" class="mt-5 inline-flex rounded-lg bg-indigo-800 px-4 py-2.5 text-sm font-semibold text-white hover:bg-indigo-900">Log in</a>
</section>
{% endblock %}
