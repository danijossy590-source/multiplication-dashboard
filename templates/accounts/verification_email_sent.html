{% extends 'base.html' %}

{% block title %}Verify Your Email | Multiply{% endblock %}

{% block content %}
<section class="site-card mx-auto max-w-lg p-6 text-center sm:p-8">
    <h1 class="text-2xl font-extrabold text-slate-900">Check your email</h1>
    <p class="mt-3 text-slate-600">
        We sent you a verification link. Open it to activate your account, then log in.
    </p>
    <p class="mt-5">
        <a href="{% url 'login' %}" class="font-semibold text-indigo-700 hover:text-indigo-900">Return to login</a>
    </p>
</section>
{% endblock %}
