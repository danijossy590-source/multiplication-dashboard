{% extends 'base.html' %}

{% block title %}Reset Password | Multiply{% endblock %}

{% block content %}
<section class="mx-auto max-w-lg rounded-xl bg-white p-5 shadow-md sm:p-8">
    <a href="{% url 'login' %}" class="text-sm font-semibold text-indigo-700 hover:underline">&larr; Back to login</a>
    <h1 class="mt-4 text-2xl font-bold text-indigo-950">Reset your password</h1>
    <p class="mt-2 text-sm text-gray-600">Enter the email address on your account. We’ll send a reset link if it matches an account.</p>
    <form method="post" class="mt-5 space-y-4">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="w-full rounded-lg bg-indigo-800 px-5 py-2.5 font-semibold text-white hover:bg-indigo-900">Send reset link</button>
    </form>
</section>
{% endblock %}
