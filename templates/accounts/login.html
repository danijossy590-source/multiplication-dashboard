{% extends 'base.html' %}

{% block title %}Login | Multiply{% endblock %}

{% block content %}
<div class="bg-white p-5 sm:p-8 rounded-xl shadow-md w-full max-w-md mx-auto">
    <h2 class="text-2xl font-bold mb-6 text-center text-indigo-900">Login to Multiply</h2>
    
    <form method="post" class="space-y-4">
        {% csrf_token %}
        {{ form.as_p }}
        
        <button type="submit" class="w-full bg-indigo-800 text-white py-2 rounded-lg font-semibold hover:bg-indigo-900 transition">
            Login
        </button>
    </form>
    
    <p class="text-sm text-center mt-4 text-gray-600">
        Don't have an account? <a href="{% url 'signup' %}" class="text-indigo-600 font-medium">Sign up here</a>
    </p>
</div>
{% endblock %}
