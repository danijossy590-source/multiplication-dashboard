{% extends 'base.html' %}

{% block title %}Login | Multiply{% endblock %}

{% block content %}
<div class="site-card mx-auto w-full max-w-md overflow-hidden">
    <div class="bg-gradient-to-br from-slate-950 via-indigo-950 to-indigo-800 px-6 py-7 text-center text-white sm:px-8">
        <span class="mx-auto inline-flex h-12 w-12 items-center justify-center rounded-2xl border border-white/15 bg-white/10"><svg class="h-6 w-6 text-indigo-100" aria-hidden="true"><use href="#icon-login"></use></svg></span>
        <p class="mt-4 text-xs font-bold uppercase tracking-[0.18em] text-indigo-200">Welcome back</p>
        <h1 class="mt-1 text-2xl font-extrabold tracking-tight">Login to Multiply</h1>
    </div>
    <div class="p-5 sm:p-8">
    
    <form method="post" class="space-y-4">
        {% csrf_token %}
        {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
        {{ form.as_p }}
        
        <button type="submit" class="inline-flex w-full items-center justify-center gap-2 rounded-xl bg-indigo-800 py-3 font-semibold text-white shadow-sm hover:bg-indigo-900">
            <svg class="h-4 w-4" aria-hidden="true"><use href="#icon-login"></use></svg>Login
        </button>
    </form>

    <p class="mt-3 text-center text-sm">
        <a href="{% url 'password_reset' %}" class="font-medium text-indigo-700 hover:underline">Forgot your password?</a>
    </p>
    
    <p class="text-sm text-center mt-4 text-gray-600">
        Don't have an account? <a href="{% url 'signup' %}" class="text-indigo-600 font-medium">Sign up here</a>
    </p>
    </div>
</div>
{% endblock %}
