{% extends 'base.html' %}

{% block title %}Launch Apprentice Pod | Multiply{% endblock %}

{% block content %}
<div class="bg-white p-8 rounded-lg shadow-md max-w-lg mx-auto">
    <h2 class="text-2xl font-bold mb-2 text-indigo-900">Launch Apprentice Pod</h2>
    <p class="text-sm text-gray-600 mb-6">Appoint a disciple to lead a new group while retaining silent read-only oversight.</p>
    
    <form method="post" class="space-y-4">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="flex flex-col-reverse gap-2 sm:flex-row sm:justify-end">
            <a href="{% url 'pod_list' %}" class="rounded-lg border border-gray-300 px-4 py-2.5 text-center text-sm font-semibold text-gray-700 hover:bg-gray-50">Cancel</a>
            <button type="submit" class="rounded-lg bg-emerald-700 px-5 py-2.5 font-semibold text-white transition hover:bg-emerald-800">Create apprentice Pod</button>
        </div>
    </form>
</div>
{% endblock %}
