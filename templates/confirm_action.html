{% extends 'base.html' %}

{% block title %}Confirm Action | Multiply{% endblock %}

{% block content %}
<section class="mx-auto max-w-xl rounded-xl border border-red-200 bg-white p-5 shadow-sm sm:p-8">
    <p class="text-xs font-bold uppercase tracking-widest text-red-700">Please confirm</p>
    <h1 class="mt-2 text-2xl font-bold text-slate-950">{{ confirmation_title }}</h1>
    <p class="mt-3 text-sm leading-6 text-slate-700">{{ confirmation_message }}</p>
    <form method="post" class="mt-6 flex flex-col-reverse gap-2 sm:flex-row sm:justify-end">
        {% csrf_token %}
        {% for name, value in hidden_fields.items %}
            <input type="hidden" name="{{ name }}" value="{{ value }}">
        {% endfor %}
        <input type="hidden" name="confirm_action" value="yes">
        <a href="{{ cancel_url }}" class="rounded-lg border border-gray-300 px-4 py-2.5 text-center text-sm font-semibold text-gray-700 hover:bg-gray-50">Cancel</a>
        <button type="submit" class="rounded-lg bg-red-700 px-4 py-2.5 text-sm font-semibold text-white hover:bg-red-800">{{ confirmation_label }}</button>
    </form>
</section>
{% endblock %}
