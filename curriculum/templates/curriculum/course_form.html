{% extends 'base.html' %}

{% block title %}Create Course | Multiply{% endblock %}

{% block content %}
<section class="mx-auto max-w-2xl rounded-xl bg-white p-6 shadow sm:p-8">
    <h1 class="text-2xl font-bold text-indigo-950">Create a Course</h1>
    <p class="mt-2 text-sm text-gray-600">Create the course shell first, then add ordered modules and lessons.</p>
    <form method="post" class="mt-6 space-y-4">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="rounded-lg bg-indigo-800 px-5 py-2.5 font-semibold text-white hover:bg-indigo-900">Create course</button>
    </form>
</section>
{% endblock %}
